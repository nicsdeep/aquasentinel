name: Release

# main → CI → production (migrate + deploy + verify). Fully automatic: no manual approval.
#
# The owner chose continuous deployment (single developer). The safety net is automated instead:
#  - Nothing reaches main without a PR whose CI passed (branch ruleset), and CI runs again here on the merge commit.
#  - CI replays every migration on a throwaway database, enforces RLS, runs security advisors and blocks
#    destructive SQL unless explicitly marked (scripts/check-destructive-sql.sh).
#  - Does nothing until the repository variable PIPELINE_ENABLED is "true".
#  - Production secrets live only in the "production" GitHub Environment, usable only from main.
#    No Claude session or developer machine holds them.
#  - One release at a time; a newer push never cancels a release that is mid-migration.
#  - Success is reported only after the live URL returns the expected commit SHA and a reachable Supabase.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@65.15.0

jobs:
  ci:
    if: vars.PIPELINE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  production:
    name: Production · migrate, deploy, verify
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      # Project-scoped Postgres connection string (session pooler). No account-wide Supabase token is used.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Migrations that will be applied (dry run)
        run: npx supabase db push --remote="$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations to production
        run: npx supabase db push --remote="$SUPABASE_DB_URL" --yes
      - name: Security advisors (production)
        run: npx supabase db advisors --remote="$SUPABASE_DB_URL" --type security --fail-on error

      - name: Build for Vercel (production)
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes "$VERCEL_CLI" build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - run: npx playwright install --with-deps chromium
      - name: Verify production is live on the public URL
        run: npm run test:smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          REQUIRE_SUPABASE: "true"

      - name: Report
        if: always()
        run: |
          {
            echo "## Production release"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url || 'not deployed' }}"
            echo "- Live URL: ${{ vars.PRODUCTION_URL }}"
            echo "- Job status: ${{ job.status }}"
            echo '### Migration status'
            echo '```'
            npx supabase migration list --remote="$SUPABASE_DB_URL" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
