<!-- AquaSentinel sign-in code email. Paste this into Supabase → Authentication → Emails → "Magic Link" (subject: "Your AquaSentinel sign-in code"). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#0c1a3a">
  <p style="font-size:20px;font-weight:bold;margin:0 0 16px">AquaSentinel</p>
  <p style="font-size:16px;margin:0 0 8px">Your sign-in code is:</p>
  <p style="font-size:34px;font-weight:bold;letter-spacing:8px;margin:0 0 16px;color:#01426f">{{ .Token }}</p>
  <p style="font-size:14px;color:#3e4f69;margin:0 0 8px">Enter it on the AquaSentinel sign-in page. It expires shortly and works only once.</p>
  <p style="font-size:14px;color:#3e4f69;margin:0">If you did not ask to sign in, you can ignore this email. Nobody can sign in without this code.</p>
</div>
